name: Wippr
configFiles: # team and bundle ID live here, overridable per developer
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Whisper:
    path: Packages/Whisper # whisper.cpp for command mode
  Llama:
    path: Packages/Llama # llama.cpp: S1-mini cleanup on the CPU, where the Neural Engine copy doesn't fit
  CoreAIModels: # Apple's Core AI runtime, for S1-mini on the Neural Engine (NeuralCleaner, iOS 27)
    url: https://github.com/apple/coreai-models
    revision: e7b24da85ea64a77d26324d7ce9607de9b955f57

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Wippr:
    type: application
    platform: iOS
    scheme: {} # so xcodebuild and Xcode have a Wippr scheme to build and run
    sources:
      - path: App
        excludes: ["Resources/.gitkeep"] # guide videos go in App/Resources (see Onboarding/GuidePlayer.swift)
      - Shared
      - Keyboard/OrbView.swift
      - Keyboard/Orb.metal
      - NeuralCleaner/NeuralProtocols.swift
    dependencies:
      - target: WipprKeyboard
      - package: Whisper
        product: whisper
      - target: LlamaCleaner
      - package: Llama # listed so llama.framework is embedded; only LlamaCleaner imports it
        product: llama
      # Embedded, not linked: it needs iOS 27 and is loaded at runtime (App/NeuralEngine.swift).
      - target: NeuralCleaner
        link: false
        embed: true
    entitlements:
      path: App/Wippr.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        # Experimental S1-mini: lets the Neural Engine run while the app is in the background (iOS 27),
        # which it always is when the keyboard asks for text. Enabled on the App ID as Background Inference.
        com.apple.developer.background-tasks.continued-processing.inference: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: noboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: noboard records your voice and turns it into text on this iPhone. Audio never leaves the device.
        NSSpeechRecognitionUsageDescription: noboard transcribes your voice on this iPhone.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [noboard]
        ITSAppUsesNonExemptEncryption: false
        AppGroup: group.$(APP_BUNDLE_ID) # read by Shared/KeyboardHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WipprKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/WipprKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: noboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: group.$(APP_BUNDLE_ID) # read by Shared/KeyboardHandoff.swift
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true # writes start/stop to the App Group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).keyboard

  LlamaCleaner: # llama.cpp behind a plain Swift API (App/CPUCleaner.swift): its ggml headers clash with whisper.cpp's
    type: framework
    platform: iOS
    sources: [LlamaCleaner]
    dependencies:
      - package: Llama
        product: llama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).llamacleaner
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # Library evolution, so the app never loads `llama` through this framework (`internal import` alone still
        # does): a compile that loads both llama and whisper fails on their two ggml.h copies.
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES

  NeuralCleaner:
    type: framework
    platform: iOS
    deploymentTarget: "27.0"
    sources: [NeuralCleaner]
    dependencies:
      - package: CoreAIModels
        product: CoreAILM
      - package: CoreAIModels
        product: CoreAISpeech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).neuralcleaner
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
