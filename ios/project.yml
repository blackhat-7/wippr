name: Wippr
options:
  bundleIdPrefix: com.satuke.noboard
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CRH6P5D9K2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Wippr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/.gitkeep"] # guide videos go in App/Resources (see Onboarding/GuidePlayer.swift)
      - Shared
      - Keyboard/OrbView.swift
      - Keyboard/Orb.metal
    dependencies:
      - target: WipprKeyboard
    entitlements:
      path: App/Wippr.entitlements
      properties:
        com.apple.security.application-groups: [group.com.satuke.noboard]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: noboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: noboard records your voice and turns it into text on this iPhone. Audio never leaves the device.
        NSSpeechRecognitionUsageDescription: noboard transcribes your voice on this iPhone.
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satuke.noboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WipprKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/WipprKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.satuke.noboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: noboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true # writes start/stop to the App Group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satuke.noboard.keyboard
