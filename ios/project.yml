name: Wippr
configFiles: # team and bundle ID live here, overridable per developer
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Wippr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/.gitkeep"] # guide videos go in App/Resources (see Onboarding/GuidePlayer.swift)
      - Shared
      - Keyboard/OrbView.swift
      - Keyboard/Orb.metal
    dependencies:
      - target: WipprKeyboard
    entitlements:
      path: App/Wippr.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: noboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: noboard records your voice and turns it into text on this iPhone. Audio never leaves the device.
        NSSpeechRecognitionUsageDescription: noboard transcribes your voice on this iPhone.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [noboard]
        ITSAppUsesNonExemptEncryption: false
        AppGroup: group.$(APP_BUNDLE_ID) # read by Shared/KeyboardHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WipprKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/WipprKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: noboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: group.$(APP_BUNDLE_ID) # read by Shared/KeyboardHandoff.swift
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true # writes start/stop to the App Group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).keyboard
