[project]
name = "wippr-bench-asr"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.14.0",
  "torchaudio",
  "triton-rocm",
  "transformers",
  "nemo_toolkit[asr]==3.0.0",
  "sherpa-onnx",
  "soundfile",
  "librosa",
  "jiwer",
  "datasets",
  "psutil",
  "requests",
  "moonshine-voice",
  "whisper-normalizer>=0.1.15",
  "sherpa-onnx-core==1.13.8",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
