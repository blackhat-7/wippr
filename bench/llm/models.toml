# Candidates. `files` maps quant -> filename in `repo`; `quants` = runs to benchmark.
# Thinking mode is not benchmarked: ~0.5k thinking tokens per case, ~1.9 s on GPU (see learnings/bench-cleanup-llm.md).
# `system` + `user_prefix` replace the shared prompt (for task-specific fine-tunes with a fixed format).

[judge]
path = "~/Documents/projects/llamacpp-tuner/tmp/models/ukisai%2FSwift-Qwen3.8-27B-GGUF/Swift-Qwen3.8-27B-Q4_K_S.gguf"

[[model]]
name = "s1-mini"
params_b = 0.6
repo = "superwhisper/s1-mini-GGUF"
files = { Q4_K_M = "s1-mini-q4_k_m.gguf", F16 = "s1-mini-f16.gguf" }
quants = ["Q4_K_M"]
system = "You are a text normalizer for speech-to-text transcripts. The input begins with a control line specifying the styling, structure, and context settings; clean the transcript to match those settings and output only the cleaned text."
user_prefix = "[Styling: semi-formal] [Structure: lists] [Context: general]\n"

